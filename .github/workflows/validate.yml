name: Validate knowledge records
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 checks/validate.py
      - run: python3 checks/retrieval_smoke.py
      - run: python3 checks/verify_figma_lab.py
